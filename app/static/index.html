<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromoEditor — открываем редактор</title>
<meta name="robots" content="noindex">
<script>
(() => {
 const variants=['wizard','studio','compact','dialog'];
 let chosen='compact';
 try {const saved=localStorage.getItem('promoeditor.design.selection.v1');if(variants.includes(saved))chosen=saved;}catch(err){}
 window.location.replace('/static/designs/'+chosen+'/index.html');
})();
</script>
</head>
<body style="font:16px system-ui,sans-serif;max-width:640px;margin:70px auto;padding:20px;">
<h1>PromoEditor</h1>
<p>Открываем последний выбранный интерфейс. Если автоматический переход не произошёл, выберите вариант:</p>
<nav aria-label="Варианты интерфейса">
<a href="/static/designs/wizard/index.html">По шагам</a> ·
<a href="/static/designs/studio/index.html">Студия</a> ·
<a href="/static/designs/compact/index.html">Компактный</a> ·
<a href="/static/designs/dialog/index.html">Диалог</a>
</nav>
</body>
</html>
