name: PromoEditor CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run application tests
        run: python -m pytest -q
      - name: Check front-end JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/editor.js
      - name: Browser editor smoke test
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18200 > /tmp/promo-browser-app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18200/api/config > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_editor_smoke.py || (cat /tmp/promo-browser-app.log && exit 1)
      - name: Browser password form with Origin null
        run: |
          export PROMO_AUTH_ENABLED=1
          export PROMO_PASSWORD_HASH="$(python -c "from app.auth import hash_password; print(hash_password('CiLoginPass1234!',iterations=300000))")"
          export PROMO_SESSION_SECRET=ci-only-session-secret-2026-with-at-least-forty-characters
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18201 > /tmp/promo-login-browser-app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18201/login > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_login_smoke.py || (cat /tmp/promo-login-browser-app.log && exit 1)
      - name: Check password-only VPS deployment scripts
        run: |
          bash -n deploy/time4vps/install.sh
          bash -n deploy/time4vps/update.sh
          bash -n deploy/time4vps/configure_caddy.sh
          bash -n deploy/time4vps/switch_to_password_login.sh
          python -m py_compile deploy/time4vps/provision_auth.py app/auth.py
      - name: Validate deployment compose syntax
        run: |
          cp deploy/app.env.example deploy/app.env
          cp deploy/caddy.env.example deploy/caddy.env
          docker compose -f compose.vps.yaml config --quiet
      - name: Validate Caddyfile with a disposable test password
        run: |
          hash="$(docker run --rm caddy:2.10.2-alpine caddy hash-password --plaintext ci-test-only)"
          {
            echo 'PROMO_DOMAIN=promo.example.test'
            echo 'PROMO_AUTH_USER=ci'
            printf "PROMO_AUTH_HASH='%s'\n" "$hash"
          } > deploy/caddy.env
          docker compose -f compose.vps.yaml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production container
        run: docker build --pull -t promoeditor:ci .
      - name: Smoke test private application port
        run: |
          docker run -d --name promo-ci -p 127.0.0.1:18000:8000 promoeditor:ci
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:18000/api/config >/dev/null 2>&1; then
              echo 'FastAPI smoke test passed'
              exit 0
            fi
            sleep 2
          done
          docker logs promo-ci
          exit 1
      - name: Container diagnostics
        if: always()
        run: docker logs promo-ci || true
